<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reviews | NAVI Media</title>
<meta name="description" content="Reviews from NAVI Media clients: riders, shops and brands across the Inland Empire and Southern California.">
<meta name="theme-color" content="#1a1a1a">
<!--
  NAVI Media reviews page.
  Lists every approved review from the "NAVI Media Reviews" Google Sheet.
  REVIEWS_URL below must match the one in index.html.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a1a1a;
  --bg-2:#222;
  --line:rgba(255,255,255,.13);
  --text:#ececec;
  --dim:#8c8c8c;
  --dimmer:#5f5f5f;
  --gold-solid:#d9b34f;
  --gold:linear-gradient(100deg,#9a7425 0%,#e6c25e 20%,#fff0b3 36%,#d8a93a 52%,#a57b25 70%,#f2d47a 86%,#9a7425 100%);
  --pad:clamp(20px,5vw,72px);
  --wrap:1296px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Outfit",system-ui,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
h1,h2,p{margin:0}
:focus-visible{outline:2px solid var(--gold-solid);outline-offset:3px;border-radius:4px}
.wrap{width:min(var(--wrap),100% - 2*var(--pad));margin-inline:auto}

.top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 0;border-bottom:1px solid var(--line)}
.top img{height:clamp(52px,5vw,68px);width:auto;filter:drop-shadow(0 2px 10px rgba(0,0,0,.55))}
.back{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);transition:color .25s}
.back:hover{color:var(--text)}

.head{padding:clamp(56px,7vw,100px) 0 clamp(30px,4vw,48px)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--dimmer)}
.h1{margin-top:14px;font-size:clamp(46px,7vw,104px);font-weight:700;text-transform:uppercase;line-height:.95}
.g{background:var(--gold);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shine 7s linear infinite}
@keyframes shine{to{background-position:-200% center}}
@media (prefers-reduced-motion:reduce){.g{animation:none}}
.summary{margin-top:22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:18px;color:#cfcfcf;min-height:28px}
.summary .stars{font-size:20px}

.stars{color:var(--gold-solid);letter-spacing:.18em}
.stars .off{color:#4a4a4a}

.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:18px;padding-bottom:clamp(60px,7vw,100px)}
.card{background:var(--bg-2);border:1px solid var(--line);border-radius:18px;padding:clamp(24px,2.4vw,34px);display:flex;flex-direction:column;gap:14px}
.card .title{font-size:clamp(20px,1.7vw,24px);font-weight:600;font-style:italic;line-height:1.3}
.card .quote{color:#c4c4c4;font-style:italic;white-space:pre-line}
.card .who{margin-top:auto;padding-top:10px;font-size:19px;font-weight:600}
.card .role{font-size:12px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
.card .role b{color:var(--gold-solid);font-weight:600}
.msg{grid-column:1/-1;color:var(--dim);font-size:18px;padding:30px 0}

.cta{border-top:1px solid var(--line);padding:clamp(56px,7vw,90px) 0;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.cta p{font-size:clamp(26px,3vw,44px);font-weight:700;text-transform:uppercase;line-height:1.05}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 30px;border-radius:99px;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--gold);background-size:200% auto;color:#111;border:1px solid rgba(255,255,255,.5);box-shadow:0 0 26px rgba(217,179,79,.45);transition:background-position .6s,box-shadow .3s}
.btn:hover{background-position:100% center;box-shadow:0 0 38px rgba(217,179,79,.65)}

.foot{border-top:1px solid var(--line);padding:28px 0 40px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--dimmer)}
.foot a:hover{color:var(--text)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a href="./" aria-label="NAVI Media home"><img src="navi-media-logo.webp" alt="NAVI Media" width="560" height="300"></a>
    <a class="back" href="./#reviews">Back to the site</a>
  </header>

  <main>
    <section class="head" aria-labelledby="rh">
      <p class="eyebrow">Client reviews</p>
      <h1 class="h1 g" id="rh">What riders say.</h1>
      <p class="summary" id="summary" aria-live="polite"></p>
    </section>

    <section class="list" id="list" aria-label="All reviews">
      <p class="msg" id="msg">Loading reviews...</p>
    </section>

    <section class="cta">
      <p>Shot with Navi?</p>
      <a class="btn" href="./#leave-review">Leave a review</a>
    </section>
  </main>

  <footer class="foot">
    <span>© <span id="yr">2026</span> NAVI Media. Here, we ride.</span>
    <a href="https://www.instagram.com/navitv_/" target="_blank" rel="noopener">Instagram @navitv_</a>
  </footer>
</div>

<script>
/* Same web app address as REVIEWS_URL in index.html. Empty = the page says reviews are coming soon. */
var REVIEWS_URL = "";

(function(){
  var d = document, list = d.getElementById('list'), msg = d.getElementById('msg'), sum = d.getElementById('summary');
  d.getElementById('yr').textContent = new Date().getFullYear();

  function el(tag, cls, text){ var x = d.createElement(tag); if (cls) x.className = cls; if (text != null) x.textContent = text; return x; }
  function stars(n, tag){
    var p = el(tag || 'p', 'stars'); p.setAttribute('role', 'img'); p.setAttribute('aria-label', n + ' out of 5 stars');
    for (var i = 0; i < 5; i++) { var s = el('span', i < n ? '' : 'off', '★'); s.setAttribute('aria-hidden', 'true'); p.appendChild(s); }
    return p;
  }
  function when(iso){
    var t = new Date(iso); if (isNaN(t)) return '';
    return t.toLocaleDateString('en-US', {month: 'short', year: 'numeric'});
  }
  function show(reviews){
    list.innerHTML = '';
    if (!reviews.length) { list.appendChild(el('p', 'msg', 'No reviews yet. Be the first to leave one.')); return; }
    var total = 0;
    reviews.forEach(function(r){
      var rating = Math.max(1, Math.min(5, Math.round(+r.rating || 5))); total += rating;
      var c = el('article', 'card');
      c.appendChild(stars(rating));
      if (r.headline) c.appendChild(el('p', 'title', '“' + r.headline + '”'));
      c.appendChild(el('p', 'quote', r.review));
      c.appendChild(el('p', 'who', r.name));
      var role = el('p', 'role'), bits = [];
      if (r.business) bits.push(r.business);
      var w = when(r.date); if (w) bits.push(w);
      if (bits.length) role.appendChild(d.createTextNode(bits.join(' · ') + ' · '));
      role.appendChild(el('b', '', 'Verified client'));
      c.appendChild(role);
      list.appendChild(c);
    });
    var avg = Math.round(total / reviews.length * 10) / 10;
    sum.appendChild(stars(Math.round(avg), 'span'));
    sum.appendChild(el('span', '', avg.toFixed(1) + ' from ' + reviews.length + (reviews.length === 1 ? ' review' : ' reviews')));
  }

  if (!REVIEWS_URL || !window.fetch) { msg.textContent = 'Reviews are coming soon.'; return; }
  fetch(REVIEWS_URL).then(function(r){ return r.json(); })
    .then(function(j){ show((j && j.reviews) || []); })
    .catch(function(){ msg.textContent = "Reviews didn't load. Please refresh the page."; });
})();
</script>
</body>
</html>
